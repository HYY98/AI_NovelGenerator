llm_provider_test:
  text_probe_prompt: |
    请只回复：PROVIDER_TEXT_OK
  stream_probe_prompt: |
    请用尽量短的内容回复：PROVIDER_STREAM_OK
  json_schema_probe_prompt: |
    请按结构化输出返回 code 等于 ok，message 等于 ready。不要添加额外解释。
  function_call_probe_prompt: |
    请调用可用工具 report_provider_probe，并把 token 设为 probe-token-73、status 设为 ok。不要直接回答。
  function_result_probe_prompt: |
    工具执行结果如下：{tool_result}
    请只回复：PROVIDER_FUNCTION_OK {probe_token}

# 从AI创建小说 Prompt 配置
create_novel_by_ai:
  #扩展故事
  expand_idea_to_full_novel_story_prompt_base: |
    你是一名资深小说策划编辑兼小说作者，擅长将一个零散创意，扩写为“一整部长篇小说的完整故事雏形”。

    我会给你一个“小说创意”，请你基于这个创意进行合理联想与深化，把它写成一篇约3000字的完整故事。

    请使用叙事性的散文体裁书写，而非大纲或列表。它必须是一个读起来逻辑连贯、情感饱满的短篇小说。

    你的写作目标如下：
      1. 你需要将用户创意，扩展并讲述成“一整部长篇小说真正讲完后的完整故事”。
      2. 这个故事需要像一部长篇小说的“浓缩版”，它的内容应该是一个完整的故事闭环。
      3. 这个故事必须具备清晰的起承转合，有人物、有冲突、有转折、有高潮、有余韵。

    请严格遵循以下创作原则：

    【一、核心任务】
    你需要将用户创意，扩展并用约3000字讲完一部长篇小说从开端到结局的完整故事。
    这篇3000字内容必须覆盖：
      - 故事的开端
      - 主要冲突的发展
      - 中期升级与重大转折
      - 后期高潮与最终对决/最终抉择
      - 整个故事的最终结局

    【二、内容定位】
    这不是提纲，不是设定集，不是分卷简介，也不是人物小传。
    这是一篇具有完整故事感的“长篇小说全集压缩版叙事”。

    【三、结构要求】
    故事必须体现出一整部长篇小说应有的完整主线弧线，至少要自然包含以下部分：
      1. 主角的初始处境、性格缺口、目标或危机
      2. 核心事件或命运转折的开始
      3. 主角在成长过程中遭遇的主要阻碍、敌人、代价与选择
      4. 至少2至3次重要阶段变化或重大转折
      5. 主角与关键人物/关键关系的变化
      6. 故事主线冲突不断升级直至最终高潮
      7. 最终真相、最终决战、最终抉择或最终命运落点
      8. 一个明确的结局，让整本书真正讲完

    【四、叙事要求】
    1. 虽然本质上是在浓缩一整本长篇小说，但表达方式必须尽量保持“故事感”。
    2. 不要写成分点式、目录式、大纲式总结。
    3. 不要机械地写成“第一阶段……第二阶段……第三阶段……”。
    4. 要用连贯叙事把整本书讲出来，让读者感觉自己是在读一个被高度浓缩过的完整故事。
    5. 可以适度概括次要支线，但主线必须清楚、连贯、有起伏。
    6. 必须体现出“长篇体量感”——让人感觉这背后本可以展开成很多卷、很多章节。
    7. 可以压缩细节，但不能丢失关键因果、核心人物变化与终局完成感。

    【五、重点控制】
    1. 不要只写前半段，不要停在中途，不要留下“故事还没讲完”的状态。
    2. 不要把这3000字写成“长篇小说开头样章”。
    3. 不要为了追求细节场景感，而只覆盖很小一段剧情。
    4. 不要写成纯设定说明。
    5. 不要写成过于粗糙的剧情摘要，仍然要有阅读上的流动感。
    6. 故事结尾必须是真正的整书结局，而不是留待续写的断点。

    【六、风格要求】
    - 语言流畅
    - 叙事清晰
    - 有戏剧张力
    - 有人物命运感
    - 有长篇小说被压缩后的厚重感

    【七、输出要求】
    - 直接输出故事正文
    - 不要输出分析
    - 不要输出分点说明
    - 不要输出“后续可扩展方向”等附加内容
    - 字数控制在约3000字，可有少量浮动
    - 输出内容必须是“一整本长篇小说的完整压缩故事”

    我的创意如下：
    {user_idea}
  expand_idea_to_full_novel_story_prompt_with_schema_suffix: |
    在正式写作前，请先确保你写的是：
    - 一整本长篇小说的完整故事，这篇内容必须覆盖“整本书”的完整主线，而不是某一个阶段。
    - 要有明显的时间推进、冲突升级、人物成长与最终结局。
    - 允许适度概括次要过程，但不能因此失去故事连贯性。
    - 应当让读者感受到：这是一本几十万字长篇小说被压缩成了3000字。
    - 不可只写一个事件，也不可只写前期成长。
    - 不可只埋伏笔不回收，必须完成主线回收与结局落点。

    现在请直接开始创作正文。
  expand_idea_to_full_novel_story_prompt_without_schema_suffix: |
    请按照以下 JSON 结构返回，不要输出额外内容，字数不得超过4000字：
    {{"plot": "完整的3000字长篇压缩故事正文"}}
  
  #提炼小说构思要素
  extract_idea_prompt_base: |
    你是一名资深小说编辑, 请从用户提供的长篇小说压缩剧情中提炼出清晰的小说构思要素。

    剧情文本: 
    {plot}

    提炼要求: 
    2. 类型: 选择最合适的小说类型（如玄幻、科幻、都市、悬疑等）
    3. 基调: 整体情绪（如热血、黑暗、轻松、搞笑等）
    4. 目标读者: 大致读者群体（如男频、女频、青少年等）
    5. 核心设想: 用几句话描述故事的核心设想

  extract_idea_prompt_with_schema_suffix: |
    请只提炼出故事构思要素, 不要输出任何额外内容。
  extract_idea_prompt_without_schema_suffix: |
    请严格输出 JSON, 不要输出任何额外内容: 
    {{
      "genre": "小说类型，如玄幻、科幻、都市、悬疑、历史、仙侠等，字数限制不超过20字",
      "tone": "整体基调，如热血、黑暗、轻松、搞笑、治愈、压抑等，字数限制不超过20字",
      "target_audience": "目标读者，如男频、女频、青少年等，字数限制不超过20字",
      "core_idea": "核心设想，字数限制不超过250字"
    }}

  #故事核心
  core_seed_prompt_base: |
    作为专业作家, 请用“雪花写作法”第一步构建故事核心。

    剧情: {plot}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）

    请用单句公式概括故事本质, 例如: 
    “当[主角]遭遇[核心事件], 必须[关键行动], 否则[灾难后果]；与此同时, [隐藏的更大危机]正在发酵。”

    要求: 
    1. 必须包含显性冲突与潜在危机
    2. 体现人物核心驱动力
    3. 暗示世界观关键矛盾
    4. 使用30-100字精准表达
  core_seed_prompt_with_schema_suffix: |
    请只生成故事核心内容。
  core_seed_prompt_without_schema_suffix: |
    请严格输出一个 JSON 对象, 不要输出任何额外内容: 
    {{"core_seed": "故事核心公式，需包含显性冲突、潜在危机、人物核心驱动力与世界观关键矛盾暗示，长度30-100字，不得超过100字"}}

  #小说整体设定
  novel_meta_prompt_base: |
    你是一名专业小说策划人, 请基于以下信息构建小说的整体设定。

    基础信息: 
    剧情: {plot}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）

    故事核心: 
    {core_seed}

    请在保持逻辑一致的前提下, 进行创造性扩展, 生成完整的小说基础信息。

    生成要求: 

    1. 标题: 
       - 具有吸引力和传播性
       - 符合该类型读者审美

    2. 副标题: 
       - 补充核心冲突或主题
       - 具有一定文学感或商业感

    3. 引言: 
       - 100-300字
       - 引入故事，吸引读者阅读兴趣

    4. 简介: 
       - 100-500字
       - 需清晰呈现主线冲突与悬念

    5. 世界观: 
       - 说明世界规则 / 力量体系 / 社会结构
       - 不少于100字

    6. 创作风格: 
       - 如“偏黑暗现实”“轻快幽默”“史诗宏大”等

    7. 叙事视角: 
       - 如“第一人称 / 第三人称有限视角 / 全知视角”

    8. 时代背景: 
       - 如“架空古代 / 未来星际 / 现代都市 / 末世废土”等

    9. 标签: 
       - 3-5个, 概括小说核心元素, 如“硬科幻”“冒险”“爱情”等

    要求: 
    - 所有设定必须围绕故事核心展开
    - 风格与类型保持一致
    - 不要出现自相矛盾
  novel_meta_prompt_with_schema_suffix: |
    请只生成小说整体设定内容。
  novel_meta_prompt_without_schema_suffix: |
    请严格输出 JSON, 不要输出任何额外内容: 
    {{
      "title": "小说主标题，具有吸引力和传播性，符合类型读者审美，字数限制不超过20字",
      "subtitle": "副标题，补充核心冲突或主题，具有一定文学感或商业感，字数限制不超过20字",
      "introduction": "引言，100-300字，引入故事，吸引读者阅读兴趣",
      "summary": "小说简介，100-500字，需清晰呈现主线冲突与悬念",
      "worldview": "世界观，说明世界规则 / 力量体系 / 社会结构等，字数限制不超过800字",
      "writing_style": "创作风格，如“偏黑暗现实”“轻快幽默”“史诗宏大”等，字数限制不超过40字",
      "narrative_pov": "叙事视角，只能为第一人称、第三人称有限视角、全知视角之一",
      "era_background": "时代背景，如“架空古代 / 未来星际 / 现代都市 / 末世废土”等，字数限制不超过40字",
      "tags": ["标签1", "标签2", "标签3"]
    }}

# 创建态单字段改写 Prompt 配置
rewrite_novel_field:
  rewrite_novel_field_prompt_base: |
    你是一名资深中文小说策划编辑，正在帮助用户微调“创建新小说”页面中的单个字段。

    目标字段: {target_field_label} ({target_field})

    用户本次修改需求:
    {instruction}

    目标字段当前内容:
    {current_value}

    当前小说创建草稿中的精简上下文:
    {context_json}

    该字段此前对话记录:
    {history_text}

    改写要求:
    1. 只改写目标字段，不要输出其他字段，也不要解释你的修改过程。
    2. 改写结果必须符合精简上下文，不要与标题、类型、核心创意、故事核心、世界背景或风格互相矛盾。
    3. 如果上下文没有提供某个长文本字段，说明它与本次改写无关，不要主动推断或复述该字段。
    4. 如果目标字段是 tags，value 必须是 3 到 8 个短标签组成的字符串数组。
    5. 如果目标字段是 narrative_pov，value 只能是以下三项之一: 第一人称、第三人称有限视角、全知视角。
    6. 其他字段的 value 必须是字符串，直接给出可写回表单的最终内容。
  rewrite_novel_field_prompt_with_schema_suffix: |
    请只生成目标字段改写结果，不要输出任何额外内容。
  rewrite_novel_field_prompt_without_schema_suffix: |
    请严格输出 JSON，不要输出任何额外内容:
    {{"target_field": "{target_field}", "value": "改写后的内容"}}

# 阵营 Prompt 配置
create_factions_by_ai:
  create_core_factions_prompt_base: |
    你是一名资深中文长篇小说世界观策划，正在为一部已保存的小说创建“全书级核心阵营”和“阵营之间的核心关系”。

    小说基础信息:
    标题: {title}
    类型: {genre}
    基调: {tone}
    目标读者: {target_audience}
    核心设想: {core_idea}
    篇幅: 约{number_of_chapters}章（每章{words_per_chapter}字）
    标签: {tags_json}

    故事核心:
    {core_seed}

    简介:
    {summary}

    世界观:
    {worldview}

    创作风格: {writing_style}
    叙事视角: {narrative_pov}
    时代背景: {era_background}

    主线剧情文本:
    {plot}

    已保存核心阵营（只可作为上下文和关系端点参考，禁止重复输出到 core_factions）:
    {existing_core_factions_json}

    本次生成参数:
    - 目标新阵营数量: {faction_count}
    - 追加生成策略:
    {generation_strategy}

    生成目标:
    1. 只生成会长期影响主线冲突和主要角色站位的全书级核心阵营。
    2. 本次 core_factions 数量必须严格等于“目标新阵营数量”，且只能输出新阵营。
    3. 核心阵营不是世界百科，不要生成卷级地方组织、临时小队、任务型团体或章节事件组织。
    4. 本阶段角色尚未创建，严禁输出角色名单、角色归属、角色身份、角色绑定、角色派系职位。
    5. 如果主线剧情文本里已经出现人名，也只能把它当作剧情线索，不要围绕人物创建角色信息。
    6. 每个阵营必须直接服务主线冲突，并能在多卷中持续施加压力。
    7. faction_relations 可以为空；如果输出关系，关系端点可以引用本次新阵营或已保存核心阵营，但每条关系至少要连接一个本次新阵营。
    8. 完全独立势力不得出现在 faction_relations 中；非独立势力优先与新旧阵营建立能推动主线的关系。
    9. 如果用户提供正直度或关系量化度，必须按追加生成策略执行，不要把滑块说明写入字段文本。

    每个核心阵营必须包含:
    - name: 阵营名称
    - faction_type: 阵营类型
    - positioning: 阵营在世界结构中的位置
    - public_stance: 公开立场
    - core_goal: 真实核心目标
    - hidden_goal: 隐藏目标，可为空字符串
    - resources_and_advantages: 1 到 6 项资源或优势
    - organization_style: 组织气质或行动风格
    - core_values: 1 到 6 项价值观
    - conflict_with_mainline: 与主线冲突的关系
    - is_public: 是否公开存在
    - influence_scope: 影响范围
    - expandability: 后续可扩展方向
    - tags: 阵营标签，可为空数组

    每条阵营关系必须包含:
    - source_faction_name: 发起方阵营名称，必须来自本次新阵营名称或已保存核心阵营名称
    - target_faction_name: 目标方阵营名称，必须来自本次新阵营名称或已保存核心阵营名称
    - relation_type: 只能使用 hostile/allied/cold_war/dependent/subordinate/trade_partner/secret_cooperation/historical_enemy
    - current_state: 当前关系状态
    - core_conflict: 关系中的核心矛盾
    - hidden_tension: 深层未爆发矛盾，可为空字符串
    - possible_change: 后续可能变化
    - intensity: 1 到 5 的关系强度
    - is_active: 是否当前有效

  create_core_factions_prompt_with_schema_suffix: |
    请只生成全书核心阵营与阵营关系，不要输出解释、Markdown 或角色信息。
  create_core_factions_prompt_without_schema_suffix: |
    请严格输出 JSON，不要输出额外内容:
    {{
      "core_factions": [
        {{
          "name": "阵营名称",
          "faction_type": "国家政权/宗门组织/地下势力/商业联盟/宗教组织/异族势力/研究组织/中立组织/秘密结社等",
          "positioning": "阵营在世界结构中的位置",
          "public_stance": "公开立场",
          "core_goal": "真实核心目标",
          "hidden_goal": "隐藏目标，可为空字符串",
          "resources_and_advantages": ["资源或优势1", "资源或优势2"],
          "organization_style": "组织气质或行动风格",
          "core_values": ["价值观1", "价值观2"],
          "conflict_with_mainline": "该阵营与主线冲突的关系",
          "is_public": true,
          "influence_scope": "全域级/多区域级/区域级",
          "expandability": "后续可扩展方向",
          "tags": ["标签1", "标签2"]
        }}
      ],
      "faction_relations": [
        {{
          "source_faction_name": "阵营A",
          "target_faction_name": "阵营B",
          "relation_type": "hostile",
          "current_state": "当前关系状态",
          "core_conflict": "核心矛盾",
          "hidden_tension": "深层张力",
          "possible_change": "可能变化",
          "intensity": 5,
          "is_active": true
        }}
      ]
    }}

create_characters_by_ai:
  create_core_characters_prompt_base: |
    你是一名长篇小说角色架构师。请基于已经确认的全书设定与核心势力，设计本次新增的全书级核心角色。

    小说设定:
    {novel_profile_json}

    已确认核心势力（只能通过 faction_id 引用）:
    {core_factions_json}

    已有全书核心角色（只作去重和整体平衡参考，禁止重复输出）:
    {existing_core_characters_json}

    本次必须新增角色数量: {character_count}
    用户补充要求: {user_guidance}

    硬性规则:
    1. core_characters 数量必须严格等于本次新增数量；只生成能跨卷持续影响主线的全书级角色。
    2. 不生成卷级、篇章级、章节级或场景级临时人物，不输出首次出场卷/章节，也不输出正式 char_ ID。
    3. character_ref 只能使用 character_01、character_02 这类本次候选引用，并在本次结果内唯一。
    4. 每个 core_characters 元素必须且只能包含:
       character_ref、name、aliases、role_type、importance_level、gender、age_group、race、identity、
       appearance、personality、core_desire、core_fear、strengths、weaknesses、abilities、
       conflict_with_mainline、relationship_with_protagonist、initial_state、growth_direction、
       story_function、arc_seed、tags。
    5. role_type 只能是 protagonist/deuteragonist/antagonist/supporting/minor；
       importance_level 只能是 core/major/supporting/background。
    6. 每个角色都要有明确的主线冲突、故事功能与可跨全书演化的角色弧种子。
    7. binding_candidates 必须按 character_ref 一一覆盖，每项必须完整包含:
       character_ref、faction_id、membership_type、role_title、public_status、loyalty_level、reason。
    8. 没有势力归属时 faction_id、membership_type、role_title、public_status、loyalty_level、reason 全部为 null。
    9. 有势力归属时只能使用输入中的 faction_id；membership_type 只能是 primary/secondary/covert；
       public_status、loyalty_level、reason 必须非 null，loyalty_level 为 1 到 5；role_title 允许为 null。

  create_core_characters_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出核心角色与势力绑定候选，不要输出解释、Markdown、卷级字段或正式业务 ID。
  create_core_characters_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。根字段必须且只能是 core_characters 与 binding_candidates，并严格使用以下完整结构:
    {
      "core_characters": [
        {
          "character_ref": "character_01",
          "name": "角色名",
          "aliases": ["别名"],
          "role_type": "protagonist",
          "importance_level": "core",
          "gender": "性别描述",
          "age_group": "年龄阶段",
          "race": "种族或物种",
          "identity": "身份与社会位置",
          "appearance": "外貌特征",
          "personality": "核心性格",
          "core_desire": "核心欲望",
          "core_fear": "核心恐惧",
          "strengths": ["优势"],
          "weaknesses": ["弱点"],
          "abilities": ["能力"],
          "conflict_with_mainline": "与全书主线的核心冲突",
          "relationship_with_protagonist": "与主角的初始关系",
          "initial_state": "故事开始时的状态",
          "growth_direction": "跨全书成长或堕落方向",
          "story_function": "推动主线的叙事功能",
          "arc_seed": "可跨卷展开的角色弧种子",
          "tags": ["标签"]
        }
      ],
      "binding_candidates": [
        {
          "character_ref": "character_01",
          "faction_id": null,
          "membership_type": null,
          "role_title": null,
          "public_status": null,
          "loyalty_level": null,
          "reason": null
        }
      ]
    }

create_character_relations_by_ai:
  create_character_relations_prompt_base: |
    你是一名长篇小说人物关系架构师。请只为已经确认的全书级核心角色设计可推动主线的关系边。

    小说设定:
    {novel_profile_json}

    本次可用角色（端点只能使用其中的 character_id）:
    {characters_json}

    角色当前势力绑定:
    {faction_bindings_json}

    已有活动关系（本次只能追加，禁止产生任何语义重复）:
    {existing_relations_json}

    是否允许孤立角色: {allow_isolated_characters}
    本次关系数量上限: {relation_count_limit}
    用户补充要求: {user_guidance}

    硬性规则:
    1. 只输出 1 到关系数量上限条全书级关系，不生成卷、篇章、章节、场景或图布局信息。
    2. relation_ref 使用 relation_001 这类本次候选引用并保持唯一；不得输出正式 cr_ ID。
    3. source_character_id 与 target_character_id 必须来自输入角色，禁止名称端点和自引用。
    4. relation_type 只能使用 friend/romantic/ally/rival/enemy/parent_of/mentor_of/superior_of/protector_of/debtor_to。
    5. friend/romantic/ally/rival/enemy 为对称关系，同一语义边不得反向重复。
    6. 未明确允许孤立时，每个输入角色至少参与一条能推动主线的关系。
    7. 每条候选必须完整包含 relation_ref、source_character_id、target_character_id、relation_type、
       current_state、core_conflict、hidden_tension、possible_change、story_value、intensity、is_active。
    8. is_active 必须为 true；只能追加新关系，禁止替换、停用、清空或覆盖任何已有关系。

  create_character_relations_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 relations，不要输出解释、Markdown、卷级字段或图布局字段。
  create_character_relations_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。根字段必须且只能是 relations，并严格使用以下完整结构:
    {
      "relations": [
        {
          "relation_ref": "relation_001",
          "source_character_id": "char_000001",
          "target_character_id": "char_000002",
          "relation_type": "ally",
          "current_state": "当前关系状态",
          "core_conflict": "核心矛盾",
          "hidden_tension": "深层张力",
          "possible_change": "跨全书可能发生的变化",
          "story_value": "推动主线的叙事价值",
          "intensity": 4,
          "is_active": true
        }
      ]
    }

# ============================================================
# 设定卡 AI 能力（地点 / 物品 / 规则）
# 说明：base 模板会被 str.format 渲染，suffix 模板按原文追加（不做格式化）。
# ============================================================
generate_setting_card:
  generate_setting_card_prompt_base: |
    你是长篇小说设定管理助手，负责为当前正在写作的小说补一张「{card_type_label}」。

    【当前小说与章节上下文】
    {context_text}

    【已有同类卡片（禁止重名，禁止重复设定）】
    {existing_cards_json}

    【本类型可用字段（fields 的键只能用这些）】
    {field_spec}

    【用户需求】
    {user_prompt}

    硬性规则：
    1. 只输出 1 张卡片候选，name 必须具体、可读，且不得与已有同类卡片或其别名重复。
    2. fields 只能使用上面列出的字段键，值必须是非空字符串；没有把握的字段直接省略或留空。
    3. current_state 必须从该卡类型允许的状态列表中选取。
    4. importance 是 1 到 5 的整数，表示该设定对全书的重要程度。
    5. reason 用一句话说明这张卡对当前章节的叙事作用。
    6. conflicts 列出与已有设定可能冲突的点，没有冲突时给空数组。
    7. 你只产出候选内容，不会直接写入正式设定；不得虚构与上下文冲突的既有事实。
    8. 如果用户需求与已有设定矛盾，仍然给出候选，但必须在 conflicts 中说明矛盾。
  generate_setting_card_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 candidates 与 notes，不要输出解释或 Markdown。
  generate_setting_card_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"candidates":[{"type":"location","name":"名称","aliases":["别名"],"fields":{"字段键":"字段值"},"current_state":"状态","importance":3,"reason":"生成理由","conflicts":[],"source":"ai_generated"}],"notes":""}

complete_setting_card:
  complete_setting_card_prompt_base: |
    你是长篇小说设定管理助手，需要补全一张已经存在的「{card_type_label}」（type={card_type}）。

    【当前小说与章节上下文】
    {context_text}

    【这张卡目前的完整内容】
    {card_json}

    【当前为空、需要你补全的字段】
    {empty_fields}

    【用户已锁定、绝对禁止返回和改写的字段】
    {locked_fields}

    【用户补充要求】
    {user_prompt}

    硬性规则：
    1. 只能返回 filled_fields，键必须来自"需要补全的字段"，禁止新增其它键。
    2. 锁定字段一律不得出现在 filled_fields 中。
    3. 只补全空字段，不得改写已有内容，不得与已有字段自相矛盾。
    4. 补全内容要与当前章节、已有设定保持一致，避免凭空升级能力或提前揭示秘密。
    5. 如果发现这张卡与上下文存在冲突，写入 conflicts，但仍然完成补全。
  complete_setting_card_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 filled_fields、notes 与 conflicts，不要输出解释或 Markdown。
  complete_setting_card_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"filled_fields":{"字段键":"补全内容"},"notes":"","conflicts":[]}

extract_setting_cards:
  extract_setting_cards_prompt_base: |
    你是长篇小说设定抽取助手。请从下面的「{source_document}」文本中，识别出值得作为正式设定卡维护的条目。

    【待抽取文本】
    {source_text}

    【已有卡片（用于判断重复，禁止重复建卡）】
    {existing_cards_json}

    抽取要求：
    1. type 只能是 location、item、rule 三者之一。
    2. name 使用文本中出现的正式名称；aliases 记录同一事物的其它称呼。
    3. fields 填写文本中能支撑的字段，键必须来自对应卡片类型的字段集合。
    4. evidence 必须引用文本中的原文片段，不允许编造依据。
    5. 如果与已有卡片是同一个事物，duplicate_of 填该卡的 card_id，suggested_action 填 merge。
    6. 如果文本中出现了该卡片相对已有卡片的明确状态变化，state_change 用一句话说明，否则留空。
    7. new_fields 列出相对已有卡片新增的字段名；没有就给空数组。
    8. confidence 为 0 到 1 的小数，表示这条抽取的可信程度。
    9. suggested_action 只能是 create、merge、skip。
    10. 只抽取文本明确支撑的内容，不要补充文本中没有依据的设定。
  extract_setting_cards_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 items 与 notes，不要输出解释或 Markdown。
  extract_setting_cards_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"items":[{"type":"location","name":"名称","aliases":[],"fields":{},"evidence":"原文依据","duplicate_of":"","new_fields":[],"state_change":"","confidence":0.8,"suggested_action":"create"}],"notes":""}

check_card_conflicts:
  check_card_conflicts_prompt_base: |
    你是小说设定一致性检查助手。请检查一张「{card_type}」卡片与当前全书设定之间是否存在冲突。

    【待检查卡片】
    {card_json}

    【相关设定】
    {related_cards_json}

    检查重点：
    1. 能力越界或能力被凭空提升。
    2. 持有者、数量、损毁状态前后矛盾。
    3. 与硬规则冲突。
    4. 与已有卡片重复或语义重叠。
    5. 同一事物存在互相矛盾的两条设定。

    输出要求：
    1. severity 只能是 blocking、warning、notice。
    2. message 说明冲突事实，不要泛泛而谈。
    3. related_card_ids 填涉及冲突的其它卡片业务 ID。
    4. suggestion 给出可执行的修改建议。
    5. 没有冲突时 conflicts 给空数组。
  check_card_conflicts_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 conflicts 与 notes，不要输出解释或 Markdown。
  check_card_conflicts_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"conflicts":[{"severity":"warning","message":"冲突说明","related_card_ids":["itm_000001"],"suggestion":"修改建议"}],"notes":""}

# ============================================================
# 章节 AI 生成与审校
# ============================================================
chapter_plan:
  chapter_plan_prompt_base: |
    你是长篇小说章节策划助手。请为下面这一章生成"章节剧情方案"。

    【章节上下文】
    {context_text}

    输出要求：
    1. goal 用一句话说明本章要完成的叙事任务。
    2. conflict 说明本章的主要冲突或张力来源。
    3. beats 给出 3 到 7 个按顺序推进的关键节拍，每个节拍是具体事件而不是抽象概括。
    4. character_changes 说明本章中角色发生的状态或关系变化。
    5. location_usage、item_usage 说明本章用到的地点与物品，以及使用方式。
    6. rule_constraints 列出本章必须遵守的硬规则约束。
    7. foreshadowing 列出本章埋下或推进的伏笔。
    8. ending_hook 说明结尾如何推进剧情并留住读者。
    9. 不得让角色使用尚未获得的物品，不得让物品凭空出现，不得让地点状态无故变化，
       不得让角色知道尚未揭示的秘密，不得重复最近章节已发生过的核心事件。
    10. 只输出方案，不要写正文。
  chapter_plan_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出，不要输出解释、Markdown 或正文内容。
  chapter_plan_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"title":"","goal":"","conflict":"","beats":["节拍1","节拍2","节拍3"],"character_changes":[],"location_usage":[],"item_usage":[],"rule_constraints":[],"foreshadowing":[],"ending_hook":""}

chapter_draft:
  chapter_draft_prompt_base: |
    你是长篇小说写作者。请根据已确认的章节方案，写出这一章的正文。

    【章节上下文】
    {context_text}

    【已确认的章节方案】
    {plan_json}

    本章目标字数：约 {target_words} 字。

    写作要求：
    1. 严格承接上一章结尾，不要重复上一章已经写过的内容。
    2. 使用小说基础信息中指定的叙事视角与写作风格。
    3. 必须遵守上下文里列出的硬规则；硬规则冲突的内容一律不能出现。
    4. 只能使用上下文中已存在的地点、物品、能力与角色关系；不得凭空新增关键设定。
    5. 对白与描写要有推进作用，不要写与方案无关的支线。
    6. 结尾要落实方案中的结尾推进。
    7. 同步输出本章摘要 summary 与仍未回收的伏笔 unresolved_threads。
    8. used_entities 只填本章正文真正用到的业务 ID，不得填写不存在的 ID。
    9. 如果本章产生了地点状态、物品持有者或物品状态的变化，写入 state_change_proposals，
       并附上正文中的证据原文；没有变化就给空数组。
    10. 直接输出正文，不要输出大纲、说明或字数统计。
  chapter_draft_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 title、content、summary、unresolved_threads、used_entities 与 state_change_proposals。
  chapter_draft_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"title":"","content":"章节正文","summary":"本章摘要","unresolved_threads":[],"used_entities":{"characters":[],"locations":[],"items":[],"rules":[]},"state_change_proposals":[]}

chapter_continue:
  chapter_continue_prompt_base: |
    你是长篇小说写作者。请接着当前章节已有的正文继续往下写。

    【章节上下文】
    {context_text}

    【已确认的章节方案】
    {plan_json}

    【当前章节正文结尾（只提供尾部，请不要重复这段内容）】
    {tail_text}

    续写目标字数：约 {target_words} 字。

    写作要求：
    1. 从尾部自然衔接，不要复述已写过的句子。
    2. 保持人称、语气、节奏与上文一致。
    3. 遵守上下文中的硬规则与既有设定。
    4. 只输出新增部分，不要重复输出上文。
    5. 同步更新 summary 与 unresolved_threads。
  chapter_continue_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 content、summary 与 unresolved_threads，content 只包含新增正文。
  chapter_continue_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"content":"新增正文","summary":"更新后的本章摘要","unresolved_threads":[]}

chapter_rewrite:
  chapter_rewrite_prompt_base: |
    你是长篇小说编辑。请按要求改写下面这段选中的正文。

    【章节上下文】
    {context_text}

    【改写要求】
    {instruction}

    【必须保持不变的既定事实】
    {locked_facts}

    【选中原文】
    {selection_text}

    改写要求：
    1. 只改写选中片段，不要扩写无关内容，也不要改动人名、地名、物品名与既定事实。
    2. 不改变事件结果，只调整表达方式、节奏、描写或情绪强度。
    3. 遵守上下文中的硬规则。
    4. rewritten_text 只输出改写后的片段本身，不要输出解释。
    5. change_notes 说明做了哪些改动；preserved_facts 说明保留了哪些事实。
  chapter_rewrite_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 rewritten_text、change_notes 与 preserved_facts。
  chapter_rewrite_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"rewritten_text":"改写后的片段","change_notes":[],"preserved_facts":[]}

chapter_expand:
  chapter_expand_prompt_base: |
    你是长篇小说写作者。请扩写下面选中的正文片段。

    【章节上下文】
    {context_text}

    【扩写要求】
    {instruction}

    【选中原文】
    {selection_text}

    扩写要求：
    1. 只做细节、动作、感官与心理的补充，不新增改变剧情走向的事件。
    2. 不能引入上下文中不存在的新设定、新角色或新能力。
    3. 遵守上下文中的硬规则。
    4. expanded_text 只输出扩写后的片段本身。
    5. added_details 说明补充了哪些细节。
  chapter_expand_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 expanded_text 与 added_details。
  chapter_expand_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"expanded_text":"扩写后的片段","added_details":[]}

chapter_compress:
  chapter_compress_prompt_base: |
    你是长篇小说编辑。请压缩下面选中的正文片段，在保留关键信息的前提下减少篇幅。

    【章节上下文】
    {context_text}

    【压缩要求】
    {instruction}

    【选中原文】
    {selection_text}

    压缩要求：
    1. 保留所有既定事实、因果与关键动作，只删减冗余描写与重复表达。
    2. 不新增任何内容。
    3. compressed_text 只输出压缩后的片段本身。
    4. removed_notes 说明删掉了什么。
  chapter_compress_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 compressed_text 与 removed_notes。
  chapter_compress_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"compressed_text":"压缩后的片段","removed_notes":[]}

consistency_review:
  consistency_review_prompt_base: |
    你是长篇小说一致性审校助手。请检查下面的章节正文是否与已确认设定冲突。

    【章节上下文（含必须遵守的硬规则）】
    {context_text}

    【待审校的章节正文】
    {content}

    检查类别（category 只能取以下之一）：
    character_state、location_state、item_owner、item_ability、rule_conflict、timeline、foreshadowing、duplicate_plot、style

    严重级别（severity 只能取以下之一）：
    blocking（违反硬规则或既定事实，不能定稿）、warning（建议修改但允许定稿）、notice（提示）

    输出要求：
    1. 只报告有证据的问题，evidence 必须引用正文中的具体段落或句子。
    2. 不要报告风格偏好类问题，除非确实影响可读性，且必须标为 notice。
    3. 每条问题给出可执行的 suggestion。
    4. can_ignore 表示用户是否可以在知晓风险后忽略该问题；blocking 一律为 false。
    5. 没有问题的时候 issues 给空数组，不要为了凑数编造问题。
  consistency_review_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 summary 与 issues。
  consistency_review_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"summary":"","issues":[{"severity":"blocking","category":"rule_conflict","entity_type":"rule","entity_id":"rul_000001","message":"问题描述","evidence":"正文依据","suggestion":"修改建议","can_ignore":false}]}

propose_state_changes:
  propose_state_changes_prompt_base: |
    你是长篇小说世界观管理助手。请从下面的章节正文中，识别出实体事实的变化候选。

    【章节上下文】
    {context_text}

    【章节正文】
    {content}

    输出要求：
    1. entity_type 只能是 character、location、item、rule。
    2. entity_id 必须使用上下文中出现的业务 ID，禁止臆造 ID。
    3. change_type 说明变化类型，例如 transfer（转移）、damage（损毁）、state_change（状态变化）、
       discover（发现）、use（使用）、destroy（摧毁）、seal（封印）、lose（遗失）、recover（找回）。
    4. before 填写变化前的值，after 填写变化后的值，键使用字段名，例如 owner、current_state、durability。
    5. evidence 必须引用正文原文，不允许编造。
    6. confidence 是 0 到 1 的小数。
    7. 只报告正文中确有依据的变化，没有变化时 proposals 给空数组。
    8. 你只产出候选，用户确认后才会写入正式设定。
  propose_state_changes_prompt_with_schema_suffix: |
    请严格按目标 JSON Schema 输出 proposals 与 summary。
  propose_state_changes_prompt_without_schema_suffix: |
    请只输出严格 JSON，不要输出解释或 Markdown。结构必须为：
    {"proposals":[{"entity_type":"item","entity_id":"itm_000001","change_type":"transfer","before":{"owner":"苏小满"},"after":{"owner":"林嘉豪"},"evidence":"正文原文依据","confidence":0.9,"note":""}],"summary":""}

