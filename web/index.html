<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>知页 · 小说工作台</title>
<link rel="icon" href="/icon.ico"><link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app" id="app">
<aside class="navigation" aria-label="工作区导航">
<div class="brand"><span class="brand-mark" aria-hidden="true">知</span><span>知页<span class="brand-sub">小说工作台</span></span></div>
<div class="nav-caption">创作空间</div>
<nav id="navigation">
<button data-mode="chapters" class="nav-button active"><span aria-hidden="true">▤</span><span>章节编辑</span><b id="count-chapters">0</b></button>
<button data-mode="location" class="nav-button"><span aria-hidden="true">⌖</span><span>地点卡</span><b id="count-location">0</b></button>
<button data-mode="item" class="nav-button"><span aria-hidden="true">◇</span><span>物品卡</span><b id="count-item">0</b></button>
<button data-mode="rule" class="nav-button"><span aria-hidden="true">≡</span><span>规则设定卡</span><b id="count-rule">0</b></button>
</nav>
<div class="nav-bottom"><span class="local-dot"></span>本地工作区</div>
</aside>
<header class="project-bar"><button id="toggle-list" class="icon-button mobile-only" title="显示或隐藏列表" aria-label="显示或隐藏列表">☰</button><label for="project-path">项目目录</label><input id="project-path" spellcheck="false" placeholder="小说项目的本地路径"><button id="open-project" class="secondary">打开</button><button id="refresh" class="icon-button" title="重新加载项目" aria-label="重新加载项目">↻</button></header>
<section class="list-panel" id="list-panel" aria-label="内容列表">
<div class="list-heading"><h1 id="list-title">章节编辑</h1><button id="create" class="icon-button add-button" title="新建章节" aria-label="新建章节">＋</button></div>
<div class="search-wrap"><span aria-hidden="true">⌕</span><input id="list-search" type="search" aria-label="搜索列表" placeholder="搜索章节"></div>
<div class="list-meta"><span id="list-count">0 章</span><span id="list-sort">章节顺序</span></div>
<div id="entries" class="entries"></div>
<div class="list-actions" id="card-actions" hidden><button id="import" class="secondary">导入 JSON</button><button id="export" class="secondary">导出</button></div>
</section>
<main class="editor-panel">
<div id="error" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" class="icon-button" aria-label="关闭错误提示" title="关闭错误提示">×</button></div>
<div class="editor-heading"><div class="editor-heading-text"><div id="breadcrumb" class="eyebrow">正文 / 章节编辑</div><h2 id="editor-title">章节编辑</h2></div><span id="dirty-badge" class="save-state">未选择</span><button id="delete" class="icon-button danger" aria-label="删除当前内容" title="删除当前内容" disabled>×</button><button id="save" class="primary" disabled>保存</button></div>
<div id="empty" class="empty-state"><div class="empty-symbol" aria-hidden="true">▤</div><h3 id="empty-title">开始新的一章</h3><button id="empty-create" class="primary">新建章节</button></div>
<section id="chapter-editor" class="chapter-editor" hidden>
<div class="editor-toolbar"><div class="tool-group"><button id="undo" class="icon-button" title="撤销" aria-label="撤销">↶</button><button id="redo" class="icon-button" title="重做" aria-label="重做">↷</button><span class="toolbar-divider"></span><button id="toggle-find" class="text-button">查找替换</button></div><div class="tool-group"><button id="previous" class="icon-button" title="上一章" aria-label="上一章">↑</button><button id="next" class="icon-button" title="下一章" aria-label="下一章">↓</button></div></div>
<div id="find-panel" class="find-panel" hidden><input id="find-text" aria-label="查找文本" placeholder="查找文本"><input id="replace-text" aria-label="替换文本" placeholder="替换为"><button id="find-next" class="secondary">下一个</button><button id="replace-one" class="secondary">替换</button><button id="replace-all" class="secondary">全部替换</button><span id="find-result" role="status"></span></div>
<textarea id="chapter-text" aria-label="章节正文" spellcheck="false" placeholder="落笔，故事从这里开始。"></textarea>
<div class="document-footer"><span id="word-count">0 字</span><span id="cursor-position">第 1 行，第 1 列</span><span>纯文本</span></div>
</section>
<section id="card-editor" class="card-editor" hidden><div class="card-top"><label class="field name-field">名称<input id="card-name" maxlength="200" autocomplete="off" placeholder="输入名称"></label><label class="enabled-control"><input type="checkbox" id="card-enabled">启用</label></div><div id="card-fields" class="card-fields"></div></section>
</main>
<footer class="status-bar"><span class="status-left"><span class="local-dot" id="status-dot"></span><span id="status" role="status" aria-live="polite">正在连接本地项目…</span></span><span id="project-summary">知页小说工作台</span></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="dialog-actions"></div></form></dialog>
</body></html>
